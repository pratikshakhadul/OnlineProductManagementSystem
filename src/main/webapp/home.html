
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            color: white;
        }

        .container h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .container p {
            color: #dcdcdc;
            font-size: 18px;
            margin-bottom: 45px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 280px;
            padding: 40px 25px;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);

            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .card h2 {
            margin-bottom: 12px;
            font-size: 25px;
        }

        .card p {
            font-size: 14px;
            margin-bottom: 25px;
            color: #ddd;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: white;

            padding: 12px 30px;
            border-radius: 30px;

            background: linear-gradient(45deg, #00c6ff, #0072ff);

            font-weight: bold;

            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.5);
        }

        .customer {
            background: linear-gradient(45deg, #f7971e, #ffd200);
        }

        .customer:hover {
            box-shadow: 0 8px 25px rgba(255, 193, 7, 0.5);
        }

        .footer {
            margin-top: 45px;
            color: #aaa;
            font-size: 13px;
        }

        @media (max-width: 650px) {

            .container h1 {
                font-size: 32px;
            }

            .card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to Our Portal</h1>

        <p>Select your login type to continue</p>

        <div class="cards">

            <!-- Admin Login -->
            <div class="card">

                <div class="icon">👨‍💼</div>

                <h2>Admin</h2>

                <p>
                    Manage users, products and application settings.
                </p>

                <a href="admin_login.jsp" class="btn">
                    Admin Login
                </a>

            </div>


            <!-- Customer Login -->
            <div class="card">

                <div class="icon">👤</div>

                <h2>Customer</h2>

                <p>
                    Login to browse products and manage your account.
                </p>

                <a href="customer_login.jsp" class="btn customer">
                    Customer Login
                </a>

            </div>

        </div>

        <div class="footer">
            © 2026 Online Portal | All Rights Reserved
        </div>

    </div>

</body>
</html>
